spring.config.import=optional:file:.env[.properties]
spring.application.name=Library
spring.datasource.url=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}?sslmode=${PGSSLMODE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}
app.invoice.s3-bucket=${INVOICE_S3_BUCKET}
app.invoice.s3-region=${INVOICE_S3_REGION:eu-west-3}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB