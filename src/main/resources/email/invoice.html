<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<style type="text/css">
  @page { margin: 30px; }
  body {
    font-family: 'Helvetica', 'Arial', sans-serif;
    color: #C8D0D8;
    font-size: 11pt;
    margin: 0;
    padding: 0;
    line-height: 1.5;
    background-color: #0F1923;
  }
  .header {
    border-bottom: 2px solid #9FEF00;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .header h1 {
    color: #9FEF00;
    font-size: 22pt;
    margin: 0 0 4px 0;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .header p {
    color: #8892B0;
    margin: 0;
    font-size: 9pt;
  }
  .invoice-meta {
    margin-bottom: 24px;
    width: 100%%;
  }
  .invoice-meta td {
    padding: 3px 0;
    font-size: 10pt;
  }
  .invoice-meta td:first-child {
    color: #8892B0;
  }
  .invoice-meta td:last-child {
    text-align: right;
    font-weight: 600;
    color: #FFFFFF;
  }
  .items {
    width: 100%%;
    border-collapse: collapse;
    margin-bottom: 24px;
  }
  .items th {
    background-color: #9FEF00;
    color: #0F1923;
    padding: 8px 12px;
    text-align: left;
    font-size: 9pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .items th:last-child {
    text-align: right;
  }
  .items td {
    padding: 10px 12px;
    border-bottom: 1px solid #2A3A4F;
    font-size: 10pt;
  }
  .items td:last-child {
    text-align: right;
    font-weight: 600;
  }
  .total-row td {
    border-bottom: none !important;
    padding-top: 12px;
  }
  .total-row td:last-child {
    font-size: 14pt;
    font-weight: 700;
    color: #9FEF00;
  }
  .footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #2A3A4F;
    font-size: 8pt;
    color: #5A6A7E;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>INVOICE</h1>
  <p>Async Mail &#8212; Education Services</p>
</div>

<table class="invoice-meta">
  <tr>
    <td>Invoice #</td>
    <td>%s</td>
  </tr>
  <tr>
    <td>Date</td>
    <td>%s</td>
  </tr>
  <tr>
    <td>Customer</td>
    <td>%s %s</td>
  </tr>
  <tr>
    <td>Email</td>
    <td>%s</td>
  </tr>
</table>

<table class="items">
  <tr>
    <th>Description</th>
    <th>Amount</th>
  </tr>
  <tr>
    <td>Course enrollment &#8212; %s</td>
    <td>%s</td>
  </tr>
  <tr class="total-row">
    <td></td>
    <td>%s</td>
  </tr>
</table>

<div class="footer">
  Async Mail &#8212; Thank you for your enrollment<br />
  For any questions, contact support@async-mail.com
</div>

</body>
</html>
